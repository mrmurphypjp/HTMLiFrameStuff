<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background-color: transparent;
    }

    .marquee-container {
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      box-sizing: border-box;
      background-color: #000080; /* Classic Deep Navy Blue */
      border-radius: 0px; /* Completely sharp/squared corners */
      border: none;
      padding: 6px 0;
    }

    .marquee-text {
      display: inline-block;
      padding-left: 100%;
      font-weight: bold;
      font-style: italic; /* Matches the italicized marquee in the image */
      color: #ffff00; /* Bright Yellow */
      font-size: 16px;
      letter-spacing: 0.5px;
      animation: marquee linear infinite;
    }

    @keyframes marquee {
      0%   { transform: translate(0, 0); }
      100% { transform: translate(-100%, 0); }
    }
  </style>
</head>
<body>

  <div class="marquee-container">
    <div class="marquee-text" id="marquee">
      <!-- Populated dynamically via URL parameter -->
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const customText = urlParams.get('text') || "Welcome to class!";
    
    const singleBlock = `${customText} &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;`;
    const fullMessage = singleBlock.repeat(6);
    
    const marqueeElement = document.getElementById('marquee');
    marqueeElement.innerHTML = fullMessage;

    const speedSeconds = Math.max(25, Math.round(fullMessage.length * 0.15));
    marqueeElement.style.animationDuration = `${speedSeconds}s`;
  </script>

</body>
</html>
